name: Validar conjunto climático
on: [push, pull_request]
jobs:
  consistencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validar_clima.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow
      - run: python scripts/validar_producao_clima.py --regenerar
      - run: node --test scripts/test_invest_producao.cjs
      - run: node --test scripts/test_clima_fragmentos.cjs
      - run: node --check clima-exploracao.js
      - run: node --check invest-producao.js
      - run: node --check clima-fragmentos.js
